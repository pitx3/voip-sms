<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'">
  <title>voip.ms SMS - Setup</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="credentials.css">
</head>
<body>
  <div class="credentials-container">
    <div class="credentials-card">
      <h1>voip.ms SMS</h1>
      <p class="credentials-subtitle">Enter your voip.ms API credentials to get started</p>
      
      <form id="credentials-form">
        <label class="form-label">
          API Username
          <input type="email" id="api-username" placeholder="you@example.com" required />
        </label>
        
        <label class="form-label">
          API Password
          <input type="password" id="api-password" placeholder="Your API password" required />
        </label>
        
        <p class="credentials-help">
          These are your Voip.ms API credentials, not your SIP credentials.
          You can set up API access at <a href="https://voip.ms" target="_blank">voip.ms</a>.
        </p>
        
        <div id="test-result" class="test-result"></div>
        
        <div class="form-buttons">
          <button type="button" id="test-connection-btn" class="btn btn-secondary">
            Test Connection
          </button>
          <button type="submit" id="save-btn" class="btn btn-primary">
            Save & Continue
          </button>
        </div>
      </form>
    </div>
  </div>
  
  <script src="credentials.js"></script>
</body>
</html>
