<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Voip.ms SMS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Mock Data Banner -->
  <div id="mock-banner" class="mock-banner" style="display: none;">
    ⚠️ MOCK DATA IN USE
  </div>

  <div class="app-container">
    <!-- Left Pane: Conversation List -->
    <div class="conversation-list-pane">
      <div class="conversation-list-header">
        <h2>Conversations</h2>
        <button class="new-conversation-btn" id="new-conversation-btn" title="New Conversation">+</button>
      </div>
      <div class="conversation-list" id="conversation-list">
        <!-- Conversations will be inserted here -->
      </div>
    </div>

    <!-- Right Pane: Message Thread -->
    <div class="message-thread-pane">
      <div class="message-thread-header" id="message-thread-header">
        <span class="contact-name">Select a conversation</span>
      </div>
      
      <div class="message-list" id="message-list">
        <!-- Messages will be inserted here -->
      </div>

      <div class="compose-box" id="compose-box">
        <textarea id="message-input" placeholder="Type a message..." rows="1"></textarea>
        <button id="send-button">Send</button>
      </div>
    </div>
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span id="status-text">Last checked: --</span>
    <span id="unread-count">0 unread</span>
  </div>

  <script src="renderer.js" type="module"></script>
</body>
</html>
